<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprinto Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Palette from sprinto.com: plum #650A41, lime #EDFBA8/#D5EA6C, warm off-white #F6F5F2, blush #FCF6F4, tan #E9D4CB, near-black #131012 */
:root{
  --ground:#f6f5f2; --raised:#ffffff; --raised-2:#fcf6f4; --raised-3:#f3e7e1;
  --line:rgba(101,10,65,.08); --line-2:rgba(101,10,65,.16);
  --ink:#292226; --muted:#5f5559; --faint:#9b9195;
  --accent:#650a41; --accent-ink:#ffffff; --em:#650a41;
  --hi:#edfba8; --hi-ink:#292226;
  --ok:#2f7a45; --bad:#b3261e; --warn:#8a5a00;
  --paper:#ffffff; --paper-2:#fcf6f4; --paper-ink:#292226; --paper-muted:#6b6165;
  --serif:"Newsreader", Georgia, serif; --sans:"Inter", system-ui, sans-serif;
  --r:14px;
  --groove:#e9d4cb; --groove-in:#f6ebe6; --knob:#ffffff; --knob-icon:#650a41; --trail:#c5df4a;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ground:#131012; --raised:#1b191a; --raised-2:#241f22; --raised-3:#2e272b;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --ink:#f5f4f5; --muted:#bfbabd; --faint:#7d767a;
  --accent:#d5ea6c; --accent-ink:#131012; --em:#eaa9cf;
  --hi:#d5ea6c; --hi-ink:#131012;
  --ok:#9ad48a; --bad:#ff8a7a; --warn:#e8c46a;
  --paper:#f6f5f2; --paper-2:#fcf6f4; --paper-ink:#292226; --paper-muted:#6b6165;
  --groove:#0a0809; --groove-in:#221d20; --knob:#3a3236; --knob-icon:#f5f4f5; --trail:#b8357a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--serif);font-weight:300;letter-spacing:-.015em;margin:0}
h1 em,h2 em{font-style:italic;color:var(--em)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ---------- sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:20px;padding:22px 14px 18px;border-right:1px solid var(--line);background:var(--ground)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px;text-decoration:none}
.brand b{font:300 26px/1 var(--serif);letter-spacing:-.02em}
.brand i{font:italic 300 26px/1 var(--serif);color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--raised);color:var(--ink)}
.nav a.on{background:var(--raised-2);color:var(--ink)}
.nav a .n{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--raised-3);color:var(--ink);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.nav a .n.hot{background:var(--hi);color:var(--hi-ink)}
.nav .sep{height:12px}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 4px;font-size:13px}
.modebox{padding:12px;border-radius:12px;background:var(--raised)}
.modebox b{display:block;font-weight:600}
.modebox span{color:var(--muted);overflow-wrap:anywhere}
.dots{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok::before{background:var(--ok)} .dot.bad::before{background:var(--bad)} .dot.warn::before{background:var(--warn)}
.worker{display:flex;align-items:center;gap:10px}
.switch{position:relative;width:34px;height:20px;flex:none;border-radius:99px;background:var(--raised-3);border:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px);background:var(--accent-ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}

/* ---------- main */
main{min-width:0;padding:40px clamp(20px,4vw,56px) 80px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.page-head h1{font-size:clamp(34px,3.4vw,52px);line-height:1.02}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.ghost{background:var(--raised-2);color:var(--ink)}
.btn.ghost:hover{background:var(--raised-3)}
.btn.quiet{background:transparent;color:var(--muted);padding:10px 12px}
.btn.quiet:hover{color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:6px 12px;font-size:13px}
.panel{background:var(--raised);border-radius:var(--r);padding:22px}
.panel h2{font-size:26px;margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:13px} .faint{color:var(--faint)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--raised-3);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.tag.ok{color:var(--ok)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)}
.tag.accent{background:var(--accent);color:var(--accent-ink)}
.empty{padding:40px 0;color:var(--muted)}
.empty h3{font-size:26px;color:var(--ink);margin-bottom:6px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--raised-2)}
input[type=text],input[type=number],input:not([type]),textarea,select{background:var(--raised-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--line-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised-3);color:var(--ink);padding:10px 18px;border-radius:99px;font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* ---------- overview */
.hero{margin:6px 0 34px}
.hero .date{color:var(--muted);font:italic 300 22px/1 var(--serif);margin-bottom:14px}
.hero h1{font-size:clamp(44px,5.4vw,84px);line-height:.98;letter-spacing:-.03em;max-width:16ch}
.hero p{margin:18px 0 0;color:var(--muted);font-size:17px}
.funnel{background:var(--raised);border-radius:var(--r);padding:26px 22px 18px;margin-bottom:22px}
.funnel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.funnel-head h2{font-size:28px}
.fscroll{overflow-x:auto;margin:10px -22px 0;padding:0 22px}
.fwrap{min-width:880px;position:relative;border-radius:12px;overflow:hidden;background:var(--raised-2)}
.band{display:block;width:100%;height:118px}
.band .fdiv{stroke-width:1;vector-effect:non-scaling-stroke}
/* soft tints of the accent, not the full-strength colour */
.band .bstop1{stop-color:color-mix(in srgb,var(--accent) 58%,var(--raised))}
.band .bstop2{stop-color:color-mix(in srgb,var(--accent) 34%,var(--raised))}
.band .bback{fill:color-mix(in srgb,var(--accent) 14%,var(--raised))}
:root[data-theme="dark"] .band .bstop1{stop-color:color-mix(in srgb,var(--accent) 70%,var(--raised))}
:root[data-theme="dark"] .band .bstop2{stop-color:color-mix(in srgb,var(--accent) 42%,var(--raised))}
.steps{display:grid;grid-template-columns:repeat(8,1fr);background:var(--raised)}
.step{appearance:none;background:none;border:0;border-left:1px solid var(--line);text-align:left;padding:14px 12px 16px;cursor:pointer;color:var(--ink);position:relative;min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.step .lbl{min-height:2.6em;align-items:flex-start}
.sico{margin-top:2px}
.step:first-child{border-left:0}
.fwrap .band .fdiv{stroke:var(--raised);opacity:.55}
.step:hover{background:var(--raised-2)}
.step .lbl{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;color:var(--muted)}
.sico{width:15px;height:15px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.numrow{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.step .num{font:400 clamp(28px,2.6vw,40px)/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.chip.down{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--muted)}
.step .conv{display:block;color:var(--muted);font-size:12px;margin-top:8px;line-height:1.35}
.step.mark .num{color:var(--accent)}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.need{display:block;text-decoration:none;background:var(--raised);border-radius:var(--r);padding:20px;transition:background .15s,transform .15s}
.need:hover{background:var(--raised-2);transform:translateY(-2px)}
.need .big{font:300 46px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.need.hot{background:var(--hi);color:var(--hi-ink)}
.need.hot:hover{background:var(--hi);filter:brightness(.97)}
.need.hot .big{color:var(--hi-ink)}
.need.hot span{color:var(--hi-ink);opacity:.75}
.need b{display:block;margin-top:10px;font-weight:600}
.need span{color:var(--muted);font-size:13.5px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.sentence{font:300 clamp(22px,2vw,30px)/1.55 var(--serif);letter-spacing:-.01em}
.sentence .pill,.pill{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:2px 2px;padding:4px 14px;border-radius:99px;background:var(--raised-2);border:1px solid var(--line-2);font:500 15px/1.6 var(--sans);color:var(--ink);cursor:pointer}
.pill:hover{background:var(--raised-3)}
.pill.set{border-color:var(--accent);color:var(--ink)}
.pill.set::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pill input{background:transparent;border:0;padding:0;width:auto;min-width:6ch;font:inherit;outline:none}
.chipbox{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;vertical-align:middle;padding:4px 8px;border-radius:22px;background:var(--raised-2);border:1px solid var(--line-2);min-width:260px;max-width:100%;font:15px/1.6 var(--sans)}
.chipbox input{border:0;background:transparent;padding:2px 4px;width:auto;flex:1;min-width:160px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 6px 1px 11px;border-radius:99px;background:var(--raised-3);font-size:13.5px}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--faint);font-variant-numeric:tabular-nums}
.meet{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.meet:first-of-type{border-top:0}

/* ---------- popovers (sentence builder) */
.popwrap{position:relative;display:inline-block}
.pop{position:absolute;z-index:20;top:calc(100% + 8px);left:0;width:300px;max-height:340px;overflow:auto;background:var(--raised-3);border:1px solid var(--line-2);border-radius:14px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.4);font:14px/1.4 var(--sans)}
.pop label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.pop label:hover{background:var(--raised-2)}
.pop input[type=checkbox],.pop input[type=radio]{accent-color:var(--accent);width:auto}
.pop .search{margin-bottom:6px}

/* ---------- pipeline board */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.board{display:grid;gap:12px;overflow-x:auto;padding-bottom:10px}
.col.slim{padding:14px 10px}
.col.slim h3{flex-direction:column;gap:6px}
.col{background:var(--raised);border-radius:var(--r);padding:14px;min-height:220px}
.col h3{font:500 14px/1.2 var(--sans);display:flex;justify-content:space-between;margin-bottom:12px;color:var(--muted)}
.col h3 b{color:var(--ink);font-weight:500}
.card{display:block;width:100%;text-align:left;background:var(--raised-2);border:0;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--ink);transition:background .15s,transform .15s}
.card:hover{background:var(--raised-3);transform:translateY(-1px)}
.card .co{font:400 19px/1.15 var(--serif);letter-spacing:-.01em}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}

/* ---------- company detail */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 18px}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:99px;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--raised-2);color:var(--ink)}
.kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kv{background:var(--raised);border-radius:12px;padding:14px}
.kv b{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-bottom:4px}
.fact{background:var(--raised-2);border-radius:10px;padding:10px 12px;margin:6px 0}
.hyp{background:var(--raised-2);border-radius:10px;padding:12px;margin:8px 0}
.detail h3{font-size:22px;margin:22px 0 10px}

/* ---------- paper (emails) */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:22px 24px;position:relative}
.paper .from{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--paper-muted);font-size:13px}
.paper .from b{color:var(--paper-ink);font-weight:600}
.paper .subj{font:400 22px/1.2 var(--serif);margin:8px 0 12px;letter-spacing:-.01em}
.paper .body{white-space:pre-wrap;font-size:15px;line-height:1.6}
.paper .tag{background:var(--paper-2);color:var(--paper-muted)}
.paper.draft{background:transparent;color:var(--ink);border:1.5px dashed var(--line-2)}
.paper.draft .from,.paper.draft .from b{color:var(--muted)}
.paper.mine{margin-left:clamp(0px,2vw,28px)}
.paper.theirs{margin-right:clamp(0px,2vw,28px);background:var(--paper-2)}
.perf{position:relative;height:0;border-top:2px dashed rgba(0,0,0,.14);margin:18px -24px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--ground)}
.perf::before{left:-11px} .perf::after{right:-11px}
.ticket input,.ticket textarea{background:var(--paper-2);border:1px solid rgba(0,0,0,.08);color:var(--paper-ink);border-radius:10px}
.ticket textarea{min-height:320px;line-height:1.6;resize:vertical}
.ticket label{display:block;font-size:13px;color:var(--paper-muted);margin:12px 0 6px}
.ticket .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.ticket .btn.ghost{background:var(--paper-2);color:var(--paper-ink)}
.ticket .btn.quiet{color:var(--paper-muted)}
.ticket .btn.danger{color:#b4372a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- split layouts (approvals, inbox) */
.split{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:260px minmax(0,1fr) 310px;gap:16px;align-items:start}
.list{background:var(--raised);border-radius:var(--r);padding:6px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:20px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:12px;cursor:pointer;color:var(--ink)}
.item:hover{background:var(--raised-2)}
.item.on{background:var(--raised-3)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .co{font:400 18px/1.2 var(--serif)}
.item .sn{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .badges{display:flex;gap:6px;margin-top:6px}
.item.unread .co::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.thread{display:flex;flex-direction:column;gap:12px}
.ov{background:var(--raised);border-radius:var(--r);padding:20px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.ov h2{font-size:26px;line-height:1.1}
.ov h4{margin:20px 0 8px;font:500 13px/1.2 var(--sans);color:var(--muted)}
.story{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line-2)}
.story li{position:relative;padding:0 0 12px 4px;font-size:13.5px}
.story li::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:2px;background:var(--faint)}
.story li.them::before{background:var(--accent)}
.story time{display:block;color:var(--faint);font-size:12px}
.act{display:block;width:100%;text-align:left;background:var(--raised-2);border:0;border-radius:12px;padding:12px;margin-bottom:8px;color:var(--ink);cursor:pointer}
.act:hover{background:var(--raised-3)}
.act.primary{background:var(--accent);color:var(--accent-ink)}
.act b{display:block;font-weight:600}
.act span{font-size:13px;opacity:.8}
.esc-card{background:var(--raised);border-radius:var(--r);padding:20px;margin-bottom:12px}
.esc-card h3{font-size:24px}


.footrow{display:flex;align-items:center;gap:8px}
.mainwrap{position:relative;min-width:0}
.corner{position:absolute;top:14px;right:clamp(16px,3vw,40px);z-index:5}
.page-head,.hero{padding-right:120px}
@media (max-width:860px){.corner{top:8px;right:10px;transform:scale(.75);transform-origin:top right}.page-head,.hero{padding-right:84px}}
/* ---------- theme switch: a knob that travels round a curved groove (light = flat, dark = round the corner) */
.tswitch{position:relative;width:104px;height:80px;flex:none;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tswitch > svg{position:absolute;inset:0;width:104px;height:80px;overflow:visible}
.tswitch .groove{stroke:var(--groove);stroke-width:26;stroke-linecap:round;fill:none}
.tswitch .groove-in{stroke:var(--groove-in);stroke-width:23;stroke-linecap:round;fill:none}
.tswitch .trail{stroke:var(--trail);stroke-width:9;stroke-linecap:round;fill:none;stroke-dasharray:140;stroke-dashoffset:140;filter:blur(3px);opacity:.85;transition:stroke-dashoffset .75s cubic-bezier(.65,0,.35,1)}
:root[data-theme="dark"] .tswitch .trail{stroke-dashoffset:0}
.tswitch .knob{position:absolute;left:0;top:0;width:38px;height:28px;border-radius:14px;offset-path:path("M16 16 H50 A36 36 0 0 1 86 52 V66");
  offset-rotate:auto;offset-distance:0%;transition:offset-distance .75s cubic-bezier(.65,0,.35,1),background .4s;background:var(--knob);
  box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.55);display:grid;place-items:center}
:root[data-theme="dark"] .tswitch .knob{offset-distance:100%}
.tswitch .knob::after{content:"";position:absolute;right:5px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--trail);filter:blur(4px);opacity:.9}
.tswitch .knob svg{width:13px;height:13px;stroke:var(--knob-icon);stroke-width:1.8;stroke-linecap:round;fill:none;position:relative;z-index:1}
.tswitch:hover .knob{box-shadow:0 8px 18px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.6)}
.tswitch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:14px}
@media (prefers-reduced-motion:reduce){.tswitch .knob,.tswitch .trail{transition:none}}

/* ---------- assistant */
.av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.35)}
.av svg{width:78%;height:78%}
.av.sm{width:26px;height:26px}
.av.lg{width:42px;height:42px}
.ai-fab{padding:0;width:60px;height:60px;justify-content:center}
.ai-fab .av{width:60px;height:60px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.3)}
.mrow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:94%}
.mrow .msg{max-width:none}
.typing{display:flex;gap:8px;align-items:center}

.ai-fab{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:10px;padding:0;border-radius:99px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 10px 24px rgba(41,34,38,.22);transition:transform .15s}
.ai-fab:hover{transform:translateY(-2px)} .ai-fab:active{transform:scale(.97)}
.ai-fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai{position:fixed;right:22px;bottom:22px;z-index:45;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 44px));display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 24px 60px rgba(41,34,38,.22);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 20px}
.ai-head h2{font-size:24px;margin:0;flex:1}
.ai-head .sub{display:block;font:13px/1.3 var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
.ai-body{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--raised-2);border-bottom-left-radius:6px}
.msg .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
.msg .links a{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--raised-3);text-decoration:none}
.msg .links a:hover{background:var(--line-2)}
.confirm{margin-top:10px;padding:12px;border-radius:12px;background:var(--raised-3);white-space:normal}
.confirm b{display:block;font-weight:600;margin-bottom:8px}
.confirm .row{display:flex;gap:8px;align-items:center}
.ai-sugg{display:flex;flex-wrap:wrap;gap:8px}
.ai-sugg button{background:var(--raised-2);border:1px solid var(--line-2);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.ai-sugg button:hover{background:var(--raised-3)}
.ai-intro{color:var(--muted);font-size:14px;margin:6px 2px 4px}
.ai-intro h3{font-size:26px;color:var(--ink);margin-bottom:6px}
.ai-foot{display:flex;gap:8px;align-items:flex-end;padding:12px 14px 14px;border-top:1px solid var(--line)}
.ai-foot textarea{resize:none;min-height:44px;max-height:140px;border-radius:14px;font-size:14.5px}
.ai-foot .btn{padding:11px 16px}
.typing{align-self:flex-start;color:var(--muted);font-size:13.5px;padding:4px 6px}
.iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:13px}
.iconbtn:hover{color:var(--ink);background:var(--raised-2)}

@media (max-width:1180px){
  .split3{grid-template-columns:280px minmax(0,1fr)}
  .split3 .ov{grid-column:1/-1;position:static;max-height:none}
  .needs{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap}
  .nav .sep{display:none}
  .side-foot{display:none}
  .split,.split3{grid-template-columns:1fr}
  .list{position:static;max-height:none}
  .kvs{grid-template-columns:repeat(2,1fr)}
  main{padding:24px 16px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/overview"><b>Sprinto</b><i>Scraper</i></a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/overview" data-r="overview"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Overview</a>
      <a href="#/find" data-r="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find companies</a>
      <div class="sep"></div>
      <a href="#/pipeline" data-r="pipeline"><svg viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></svg>Pipeline</a>

      <a href="#/needs" data-r="needs"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01M10.3 3.9 2.6 17.3A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.7L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Needs you<span class="n" id="cNeeds" hidden></span></a>
      <a href="#/activity" data-r="activity"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>Activity</a>

    <div class="side-foot">

      <div class="dots" id="dots"></div>
      <div class="footrow">
        <div class="worker">
          <button class="switch" id="autoTick" role="switch" aria-checked="false" aria-label="Run the agent automatically"></button>
          <div><div>Auto-run</div><button class="linkbtn small" id="tickNow">Run now</button></div>
        </div>
      </div>
      <div class="faint small" id="tickMsg"></div>
    </div>
  </aside>
  <div class="mainwrap">
    <div class="corner">
      <button class="tswitch" id="theme" role="switch" aria-checked="true" aria-label="Dark mode">
        <svg viewBox="0 0 104 80" aria-hidden="true"><path class="groove" d="M16 16 H50 A36 36 0 0 1 86 52 V66"/><path class="groove-in" d="M16 16 H50 A36 36 0 0 1 86 52 V66"/><path class="trail" d="M16 16 H50 A36 36 0 0 1 86 52 V66"/></svg>
        <span class="knob"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></span>
      </button>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<button class="ai-fab" id="aiFab" aria-haspopup="dialog" aria-controls="ai" aria-label="Ask the assistant" title="Ask the assistant"><span class="av"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="15" ry="6.5" transform="rotate(-24 20 20)" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".45"/><path d="M20 8.5c.9 6.2 2.4 7.7 8.6 8.6v.1c-6.2.9-7.7 2.4-8.6 8.6h-.1c-.9-6.2-2.4-7.7-8.6-8.6v-.1c6.2-.9 7.7-2.4 8.6-8.6z" fill="currentColor"/><circle cx="29.5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="28.5" r=".9" fill="currentColor" opacity=".7"/></svg></span></button>
<section class="ai" id="ai" role="dialog" aria-label="Project assistant" hidden>
  <div class="ai-head"><span class="av lg"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="15" ry="6.5" transform="rotate(-24 20 20)" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".45"/><path d="M20 8.5c.9 6.2 2.4 7.7 8.6 8.6v.1c-6.2.9-7.7 2.4-8.6 8.6h-.1c-.9-6.2-2.4-7.7-8.6-8.6v-.1c6.2-.9 7.7-2.4 8.6-8.6z" fill="currentColor"/><circle cx="29.5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="28.5" r=".9" fill="currentColor" opacity=".7"/></svg></span><h2>Assistant<span class="sub">Only about this project. It can also do the work.</span></h2>
    <button class="iconbtn" id="aiNew" title="Start a new chat">New chat</button><button class="iconbtn" id="aiClose" aria-label="Close assistant">✕</button></div>
  <div class="ai-body" id="aiBody" aria-live="polite"></div>
  <form class="ai-foot" id="aiForm"><textarea id="aiIn" rows="1" placeholder="Ask, or tell it what to do…" aria-label="Message the assistant"></textarea><button class="btn" id="aiSend">Send</button></form>
</section>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch(e) {} throw new Error(m); }
  return r.json();
}
const post = (path, body = {}) => api(path, {method: "POST", body: JSON.stringify(body)});
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3200); }
const emptyFilters = () => ({industries: [], headcount: [], funding_series: [], funded_within_months: null});
const S = {status: null, ov: null, route: "", busy: false, disc: {search: null, f: emptyFilters()}, tab: "evidence"};

// ---------- formatting
const STAGE = {QUEUED:"Queued", RESEARCHING:"Researching", QUALIFIED:"Qualified", CONTACT_SELECTED:"Contact found", PAIN_READY:"Writing email",
  DRAFT_READY:"Email ready", AWAITING_APPROVAL:"Needs approval", AWAITING_REPLY:"Awaiting reply", MEETING_BOOKED:"Meeting booked",
  WAITING_INTEGRATION:"Waiting on a service", ESCALATED:"Needs you", DONE:"Closed"};
const nice = s => s ? (STAGE[s] || String(s).replace(/_/g, " ").toLowerCase().replace(/^./, c => c.toUpperCase())) : "";
function tag(t, cls){ if (!t) return ""; const s = String(t);
  const tone = cls || (/FAIL|DISQUAL|REJECT|OPTED|ESCALATED|NO_SUITABLE|INSUFFICIENT|ERROR|BAD/i.test(s) ? "bad" :
    /QUALIFIED$|BOOKED|SENT|OK|PASS|READY$/i.test(s) ? "ok" : /APPROVAL|WAIT|AWAITING|UNCERTAIN|PROPOSED/i.test(s) ? "warn" : "");
  return `<span class="tag ${tone}">${esc(nice(s))}</span>`; }
function ago(ts){ if (!ts) return ""; const d = (Date.now() - new Date(ts)) / 1000;
  if (d < 60) return "now"; if (d < 3600) return Math.floor(d/60) + "m"; if (d < 86400) return Math.floor(d/3600) + "h";
  return new Date(ts).toLocaleDateString(undefined, {day: "numeric", month: "short"}); }
const when = ts => ts ? new Date(ts).toLocaleString(undefined, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;

// ---------- shell
function setCount(id, n, hot){ const el = $(id); el.hidden = !n; el.textContent = n; el.classList.toggle("hot", !!hot && n > 0); }
async function loadShell(){
  try {
    const [st, ov] = await Promise.all([api("/api/status"), api("/api/overview")]);
    S.status = st; S.ov = ov;
    const r = st.readiness, s = st.settings;
    $("#modebox").innerHTML = s.mode === "real_demo"
      ? `<b>Real demo</b><span>Real emails, sent only to ${esc(s.demo_recipient || "the demo inbox")}.</span>`
      : s.mode === "dry_run" ? `<b>Dry run</b><span>Real reads; nothing is sent.</span>`
      : `<b>Simulation</b><span>Sample companies; nothing real is sent.</span>`;
    const dot = (label, v, ok) => `<span class="dot ${ok ? "ok" : (v && v.simulated ? "warn" : "bad")}">${label}</span>`;
    $("#dots").innerHTML = dot("AI", r.llm, r.llm.configured !== false) + dot("Hunter", r.hunter, r.hunter.configured !== false && !/NOT/.test(r.hunter.label)) +
      dot("Gmail", r.gmail, !/NOT/.test(r.gmail.label)) + dot("Calendar", r.calendar, !/NOT/.test(r.calendar.label));
    setCount("#cApprovals", ov.approvals, true); setCount("#cInbox", ov.replies_waiting, true); setCount("#cNeeds", ov.escalations, true);
    if (S.autoInit === undefined) { S.autoInit = true; let on = !!st.serverless;
      try { const v = localStorage.getItem("autoTick"); if (v !== null) on = v === "1"; } catch(e) {}
      $("#autoTick").setAttribute("aria-checked", String(on)); }
  } catch(e) { $("#modebox").innerHTML = `<b>Offline</b><span>${esc(e.message)}</span>`; }
}

// ---------- router
const ROUTES = {overview: vOverview, find: vFind, pipeline: vPipeline, companies: vCompanies, approvals: vApprovals, inbox: vInbox, needs: vNeeds, activity: vActivity};
function parse(){ const h = location.hash.replace(/^#\/?/, "") || "overview"; const [path, q] = h.split("?");
  const parts = path.split("/"); return {name: parts[0], id: parts[1], q: new URLSearchParams(q || "")}; }
async function render(soft){
  const r = parse(); S.r = r;
  $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r.name));
  const fn = ROUTES[r.name] || vOverview;
  try { await fn(r, soft); } catch(e) { $("#view").innerHTML = `<div class="empty"><h3>Something went wrong</h3>${esc(e.message)}</div>`; }
  if (!soft) { $("#view").focus({preventScroll: true}); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", () => render(false));

// ---------- overview
const STEP_HINT = {added:"every company you added", researched:"websites read", qualified:"fit Sprinto's rubric", contact:"a named person found",
  drafted:"personalised email written", sent:"delivered to the demo inbox", replied:"answered the email", booked:"on the calendar"};
const STEP_ICON = {
  added: '<path d="M12 5v14M5 12h14"/>',
  researched: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>',
  qualified: '<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
  contact: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
  drafted: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  sent: '<path d="M21 3 10 14"/><path d="M21 3 14 21l-4-7-7-4z"/>',
  replied: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/>',
  booked: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'};
// the funnel as a band hanging from the top: its depth over each step is that step's share of "Added"
function bandSVG(st){
  const W = 1000, H = 130, n = st.length, max = Math.max(1, ...st.map(s => s.count));
  const depth = v => v > 0 ? 18 + (H - 30) * v / max : 10;
  const curve = (extra) => {
    const pts = [[0, depth(st[0].count) + extra], ...st.map((s, i) => [(i + .5) * W / n, depth(s.count) + extra]),
                 [W, depth(st[n - 1].count) + extra]];
    let d = `M0,0 L0,${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {  // Catmull-Rom -> cubic Bezier, smooth through every point
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d + ` L${W},0 Z`;
  };
  const lines = st.slice(1).map((_, i) => `<line x1="${(i + 1) * W / n}" x2="${(i + 1) * W / n}" y1="0" y2="${H}" class="fdiv"/>`).join("");
  return `<svg class="band" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="bandg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" class="bstop1"/><stop offset="1" class="bstop2"/></linearGradient></defs>
    <path d="${curve(14)}" class="bback"/>
    <path d="${curve(0)}" fill="url(#bandg)"/>${lines}</svg>`;
}
async function vOverview(r, soft){
  const [ov, act] = await Promise.all([api("/api/overview"), api("/api/activity?limit=7")]);
  S.ov = ov;
  const st = ov.steps, c = Object.fromEntries(st.map(s => [s.key, s.count]));
  let head;
  if (ov.approvals) head = `${plural(ov.approvals, "email")} ${ov.approvals === 1 ? "waits" : "wait"} for <em>your approval.</em>`;
  else if (ov.escalations) head = `${plural(ov.escalations, "company", "companies")} ${ov.escalations === 1 ? "needs" : "need"} <em>your decision.</em>`;
  else if (ov.replies_waiting) head = `A new reply is <em>being read.</em>`;
  else if (ov.in_progress) head = `${plural(ov.in_progress, "company", "companies")} ${ov.in_progress === 1 ? "is" : "are"} <em>being researched.</em>`;
  else if (!c.added) head = `Start by <em>finding companies.</em>`;
  else head = `All quiet. <em>Nothing needs you.</em>`;
  // where do companies stop? the largest drop between two consecutive steps
  let mark = -1, drop = 0;
  for (let i = 0; i < st.length - 1; i++) { const d = st[i].count - st[i+1].count; if (d > drop) { drop = d; mark = i; } }
  const date = new Date().toLocaleDateString(undefined, {weekday: "long", day: "numeric", month: "long"});
  $("#view").innerHTML = `
  <section class="hero">
    <div class="date">${esc(date)}</div>
    <h1>${head}</h1>
    <p>${plural(c.added, "company", "companies")} added · ${plural(c.sent, "email")} sent · ${plural(c.booked, "meeting")} booked${ov.require_approval ? " · every email waits for your approval" : ""}.</p>
  </section>
  <section class="funnel" aria-labelledby="fh">
    <div class="funnel-head"><h2 id="fh">The funnel</h2><span class="muted small">Click a step to see those companies${mark >= 0 ? ` · <span style="color:var(--accent)">most drop after “${esc(st[mark].label)}”</span>` : ""}</span></div>
    <div class="fscroll"><div class="fwrap">${bandSVG(st)}
    <div class="steps">${st.map((s, i) => {
      const prev = i ? st[i-1].count : null;
      const chip = i === 0 ? "start" : (prev ? Math.round(100 * s.count / prev) + "%" : "—");
      return `<button class="step ${i === mark ? "mark" : ""}" onclick="location.hash='#/pipeline?step=${s.key}'"
          aria-label="${esc(s.label)}: ${s.count}${i && prev ? `, ${chip} of the previous step` : ""}. Show these companies">
        <span class="lbl"><svg class="sico" viewBox="0 0 24 24" aria-hidden="true">${STEP_ICON[s.key] || ""}</svg>${esc(s.label)}</span>
        <span class="numrow"><span class="num">${s.count}</span><span class="chip ${i && prev && s.count < prev ? "down" : ""}">${chip}</span></span>
        <span class="conv">${esc(STEP_HINT[s.key])}</span></button>`; }).join("")}</div></div></div>
  </section>
  <section class="needs" aria-label="What needs attention">
    <a class="need ${ov.approvals ? "hot" : ""}" href="#/approvals"><div class="big">${ov.approvals}</div><b>Emails to approve</b><span>${ov.approvals ? "Nothing goes out until you approve it" : "Nothing waiting"}</span></a>
    <a class="need ${ov.replies_waiting ? "hot" : ""}" href="#/inbox"><div class="big">${ov.awaiting_reply}</div><b>Conversations open</b><span>${ov.replies_waiting ? plural(ov.replies_waiting, "new reply", "new replies") : "Waiting for their replies"}</span></a>
    <a class="need ${ov.escalations ? "hot" : ""}" href="#/needs"><div class="big">${ov.escalations}</div><b>Paused for you</b><span>${ov.escalations ? "A decision only you can make" : "Nothing paused"}</span></a>
    <a class="need" href="#/pipeline?step=booked"><div class="big">${ov.meetings.length}</div><b>Meetings booked</b><span>${ov.meetings[0] ? esc(ov.meetings[0].company + " · " + ov.meetings[0].slot) : "None yet"}</span></a>
  </section>
  <div class="two">

function humanAct(a){
  const m = {queue_for_approval:"email drafted, waiting for your approval", approve_email:"you approved an email", discard_email:"you discarded an email",
    send_email:"email sent", read_thread_replies:"checked for replies", check_calendar:"checked the calendar", create_calendar_event:"booked the meeting",
    escalate:"paused for your decision", hunter_domain_search:"looked up contacts on Hunter", update_crm:"logged the outcome"};
  return (m[a.action] || m[a.tool] || (a.action || "").replace(/_/g, " ")) + (a.status && /error|fail/i.test(a.status) ? " (failed)" : "");
}
function initDomainBox(){
  const box = $("#domBox"); if (!box) return; S.domains = S.domains || [];
  const paint = () => { box.querySelectorAll(".chip").forEach(c => c.remove());
    S.domains.forEach((d, i) => { const c = document.createElement("span"); c.className = "chip";
      c.innerHTML = `${esc(d)}<button aria-label="Remove ${esc(d)}">✕</button>`; c.querySelector("button").onclick = () => { S.domains.splice(i, 1); paint(); };
      box.insertBefore(c, $("#domIn")); }); };
  const add = v => { v.split(/[\s,]+/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!S.domains.includes(x)) S.domains.push(x); }); paint(); };
  $("#domIn").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(e.target.value); e.target.value = ""; }
    else if (e.key === "Backspace" && !e.target.value && S.domains.length) { S.domains.pop(); paint(); } });
  $("#domIn").addEventListener("paste", e => { e.preventDefault(); add(e.clipboardData.getData("text")); });
  if ($("#fx")) $("#fx").onclick = () => add("acmecloud.example brightbakery.example certifyfast.example quietsaas.example nocontact.example flakyco.example");
  $("#startRun").onclick = async () => {
    add($("#domIn").value); $("#domIn").value = "";
    if (!S.domains.length) { $("#runMsg").textContent = "Add at least one company website."; return; }
    try { const r = await post("/api/runs", {domains_text: S.domains.join("\n")});
      S.domains = []; toast(`Queued ${plural(r.domains.length, "company", "companies")}`);
      $("#runMsg").textContent = r.rejected.length ? "Skipped: " + r.rejected.join(", ") : ""; tickNow(); render(true);
    } catch(e) { $("#runMsg").textContent = e.message; }
  };
  paint();
}

  const d = m.data || {};
  const links = (d.links || []).map(l => `<a href="${esc(l.href)}" onclick="aiNav(event,'${esc(l.href)}')">${esc(l.label)} →</a>`).join("");
  const acts = (d.actions || []).map(a => `<div class="confirm" id="act_${esc(a.id)}"><b>${esc(a.summary)}</b>${a.status && a.status !== "pending"
      ? `<span class="tag ${a.status === "done" ? "ok" : a.status === "failed" ? "bad" : ""}">${esc(a.status === "done" ? "Done" : a.status === "failed" ? "Failed" : "Cancelled")}</span>`
      : `<div class="row"><button class="btn sm" onclick="aiDecide('${esc(a.id)}','confirm')">Confirm</button><button class="btn quiet sm" onclick="aiDecide('${esc(a.id)}','cancel')">Cancel</button></div>`}</div>`).join("");
  const bubble = `<div class="msg ${m.role === "user" ? "user" : "assistant"}">${esc(m.content)}${links ? `<div class="links">${links}</div>` : ""}${acts}</div>`;
  return m.role === "user" ? bubble : `<div class="mrow"><span class="av sm">${AV_SVG}</span>${bubble}</div>`;
}
function aiNav(e, href){ e.preventDefault(); location.hash = href; if (window.innerWidth < 860) aiShow(false); }
async function aiLoad(){
  const h = await api(`/api/assistant/${AI.conv}`);
  $("#aiBody").innerHTML = h.length ? h.map(aiMsgHTML).join("") :
    `<div class="ai-intro"><h3>Ask about the project, or give it work.</h3>It reads only this app's data and won't answer anything else. Sending emails or starting research always waits for your Confirm.</div>
     <div class="ai-sugg">${SUGG.map(x => `<button type="button" onclick="aiSend(this.textContent)">${esc(x)}</button>`).join("")}</div>`;
  $("#aiBody").scrollTop = 1e9;
}
function aiShow(on){ $("#ai").hidden = !on; $("#aiFab").hidden = on; if (on) { aiLoad(); setTimeout(() => $("#aiIn").focus(), 50); } else $("#aiFab").focus(); }
async function aiSend(text){
  text = (text || $("#aiIn").value).trim(); if (!text || AI.busy) return;
  AI.busy = true; $("#aiIn").value = ""; $("#aiSend").disabled = true;
  if ($(".ai-intro")) $("#aiBody").innerHTML = "";
  $("#aiBody").insertAdjacentHTML("beforeend", aiMsgHTML({role: "user", content: text}) + `<div class="typing" id="aiTyping"><span class="av sm">${AV_SVG}</span>Working on it…</div>`);
  $("#aiBody").scrollTop = 1e9;
  try { await post("/api/assistant", {conversation_id: AI.conv, message: text}); }
  catch(e) { $("#aiBody").insertAdjacentHTML("beforeend", aiMsgHTML({role: "assistant", content: "Sorry, that failed: " + e.message})); }
  AI.busy = false; $("#aiSend").disabled = false; await aiLoad(); loadShell(); render(true);
}
async function aiDecide(id, decision){
  const box = $("#act_" + id); if (box) box.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await post(`/api/assistant/actions/${id}/${decision}`); } catch(e) { toast(e.message); }
  await aiLoad(); loadShell(); render(true);
}
$("#aiFab").onclick = () => aiShow(true);
$("#aiClose").onclick = () => aiShow(false);
$("#aiNew").onclick = () => { AI.conv = "c" + Math.random().toString(36).slice(2, 10); try { localStorage.setItem("aiConv", AI.conv); } catch(e) {} aiLoad(); };
$("#aiForm").onsubmit = e => { e.preventDefault(); aiSend(); };
$("#aiIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiSend(); } });
$("#aiIn").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#ai").hidden) aiShow(false); });
loadShell().then(() => render(false));
</script>
</body>
</html>
